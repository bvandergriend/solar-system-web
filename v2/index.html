<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solar System Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="sky"></canvas>

  <!-- Top-left heads-up display -->
  <div id="hud">
    <div id="hud-date"></div>
    <div id="hud-meta"></div>
    <div id="hud-zoom"></div>
  </div>

  <!-- Top-right tour menu — click any body to zoom to it -->
  <div id="bodies">
    <h3>Visit a body</h3>
    <button data-body="Sun">     <span class="g">☉</span> The Sun                 </button>
    <button data-body="Mercury"> <span class="g">☿</span> Mercury                 </button>
    <button data-body="Venus">   <span class="g">♀</span> Venus                   </button>
    <button data-body="Earth">   <span class="g">♁</span> Earth     <em>· Moon</em></button>
    <button data-body="Mars">    <span class="g">♂</span> Mars      <em>· 2 moons</em></button>
    <button data-body="Jupiter"> <span class="g">♃</span> Jupiter   <em>· 5 moons</em></button>
    <button data-body="Saturn">  <span class="g">♄</span> Saturn    <em>· 7 moons</em></button>
    <button data-body="Uranus">  <span class="g">♅</span> Uranus    <em>· 5 moons</em></button>
    <button data-body="Neptune"> <span class="g">♆</span> Neptune   <em>· 3 moons</em></button>
    <button data-body="Pluto">   <span class="g">♇</span> Pluto     <em>· Charon</em></button>
    <button data-body="Halley">  <span class="g">☄</span> Halley's Comet          </button>
  </div>

  <!-- Side info panel (hidden until a body is selected) -->
  <aside id="info" class="hidden">
    <button id="info-close" aria-label="Close">×</button>
    <h2 id="info-name"></h2>
    <div id="info-type"></div>
    <button id="info-track" class="action">Track this body</button>
    <table id="info-table"></table>
    <p id="info-fact"></p>
  </aside>

  <!-- Tour overlay (hidden until started) -->
  <div id="tour" class="hidden">
    <div id="tour-step"></div>
    <div id="tour-buttons">
      <button id="tour-prev">‹ Back</button>
      <button id="tour-next">Next ›</button>
      <button id="tour-end">Exit tour</button>
    </div>
  </div>

  <!-- Bottom control bar -->
  <div id="controls">
    <div class="ctrl-group">
      <label>Date</label>
      <input type="date" id="date-picker">
      <button id="now-btn" class="btn">Now</button>
    </div>

    <div class="ctrl-group time-ctrl">
      <div class="time-axis">
        <span class="dir backward">◀ REWIND</span>
        <span class="dir centre">⏸ PAUSED</span>
        <span class="dir forward">FAST FORWARD ▶</span>
      </div>
      <input type="range" id="speed" min="-6" max="6" step="0.05" value="0.2">
      <div class="speed-readout"><span id="speed-label">paused</span></div>
    </div>

    <div class="ctrl-group">
      <label>Jump to</label>
      <select id="events">
        <option value="">— Famous events —</option>
      </select>
    </div>

    <div class="ctrl-group">
      <button id="reset-view" class="btn">Reset view</button>
      <button id="tour-start" class="btn primary">Take the tour</button>
    </div>
  </div>

  <!-- Help overlay (first-time tip) -->
  <div id="help">
    <div>Drag&nbsp;·&nbsp;rotate&nbsp;&nbsp;|&nbsp;&nbsp;Scroll&nbsp;·&nbsp;zoom&nbsp;&nbsp;|&nbsp;&nbsp;Shift+drag&nbsp;·&nbsp;pan&nbsp;&nbsp;|&nbsp;&nbsp;Click a body for info</div>
  </div>

  <!-- Texture attribution (CC-BY 4.0) -->
  <div id="credit">
    Planet textures
    <a href="https://www.solarsystemscope.com/textures/" target="_blank" rel="noopener">© Solar System Scope</a>
    (CC-BY 4.0) · derived from NASA imagery
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
